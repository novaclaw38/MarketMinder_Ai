<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MarketMinder AI - Mission Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary': '#3b82f6',
                        'success': '#10b981',
                        'warning': '#f59e0b',
                        'danger': '#ef4444',
                        'optimal': '#10b981',
                        'yellow': '#f59e0b',
                        'red': '#ef4444',
                    }
                }
            }
        }
    </script>
    <style>
        .metric-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .status-badge {
            font-size: 0.75rem;
        }
        .pulse {
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body class="bg-gray-50">
    <div class="min-h-screen">
        <!-- Header -->
        <div class="bg-white shadow-sm border-b">
            <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
                <h1 class="text-2xl font-bold text-gray-900">MarketMinder AI - Mission Control</h1>
                <div class="flex items-center space-x-4">
                    <span id="health-score" class="text-lg font-semibold">Loading...</span>
                    <span class="text-sm text-gray-500">Last updated: <span id="last-update">-</span></span>
                </div>
            </div>
        </div>

        <!-- Health Status Banner -->
        <div id="health-banner" class="py-4 px-4">
            <div class="max-w-7xl mx-auto px-4">
                <div id="banner-content" class="rounded-lg p-4 flex items-center justify-between">
                    <div class="flex items-center space-x-3">
                        <svg id="status-icon" class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.586 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
                        </svg>
                        <span id="status-text" class="font-medium">Loading health status...</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Main Dashboard -->
        <div class="max-w-7xl mx-auto px-4 py-8">
            <!-- Key Metrics -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
                <div class="metric-card text-white rounded-lg p-6">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-white/80 text-sm">MRR</p>
                            <p class="text-2xl font-bold" id="mrr">$0</p>
                        </div>
                        <div class="p-3 bg-white/20 rounded-full">
                            <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20"><path d="M2 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V15a2 2 0 01-2 2H5a2 2 0 01-2-2V5z"/></svg>
                        </div>
                    </div>
                </div>

                <div class="metric-card text-white rounded-lg p-6">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-white/80 text-sm">ARR</p>
                            <p class="text-2xl font-bold" id="arr">$0</p>
                        </div>
                        <div class="p-3 bg-white/20 rounded-full">
                            <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-11.5a1 1 0 10-2 0v2a1 1 0 001 1h2a1 1 0 100-2h-2V6z"/></svg>
                        </div>
                    </div>
                </div>

                <div class="metric-card text-white rounded-lg p-6">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-white/80 text-sm">Churn Rate</p>
                            <p class="text-2xl font-bold" id="churn">0%</p>
                        </div>
                        <div class="p-3 bg-white/20 rounded-full">
                            <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/></svg>
                        </div>
                    </div>
                </div>

                <div class="metric-card text-white rounded-lg p-6">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-white/80 text-sm">Cash Runway</p>
                            <p class="text-2xl font-bold" id="runway">0 days</p>
                        </div>
                        <div class="p-3 bg-white/20 rounded-full">
                            <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20"><path d="M4 4a2 2 0 00-2 2v4a2 2 0 002 2h12a2 2 0 002-2V6a2 2 0 00-2-2H4z"/></svg>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Agents Grid -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-8">
                <!-- Agent Status -->
                <div class="bg-white rounded-lg shadow-sm p-6">
                    <h2 class="text-lg font-semibold text-gray-900 mb-4">Agent Status</h2>
                    <div id="agents-grid" class="space-y-3">
                        <!-- Agents will be populated here -->
                    </div>
                </div>

                <!-- Health Score -->
                <div class="bg-white rounded-lg shadow-sm p-6">
                    <h2 class="text-lg font-semibold text-gray-900 mb-4">Health Score</h2>
                    <div class="text-center">
                        <div id="health-score-circle" class="w-32 h-32 mx-auto rounded-full bg-gray-200 flex items-center justify-center">
                            <span class="text-3xl font-bold" id="health-score-value">0</span>
                        </div>
                        <p class="mt-2 text-sm text-gray-500" id="health-status">Calculating...</p>
                    </div>
                </div>

                <!-- Quick Actions -->
                <div class="bg-white rounded-lg shadow-sm p-6">
                    <h2 class="text-lg font-semibold text-gray-900 mb-4">Quick Actions</h2>
                    <div class="space-y-2">
                        <button id="btn-scan" class="w-full btn-primary">Scan Market Trends</button>
                        <button id="btn-content" class="w-full btn-secondary">Generate Content</button>
                        <button id="btn-report" class="w-full btn-secondary">Create Report</button>
                    </div>
                </div>
            </div>

            <!-- Failure Conditions -->
            <div class="bg-white rounded-lg shadow-sm p-6 mb-8">
                <h2 class="text-lg font-semibold text-gray-900 mb-4">Failure Conditions</h2>
                <div id="failure-conditions" class="space-y-2">
                    <!-- Conditions will be populated here -->
                </div>
            </div>

            <!-- Review Points -->
            <div class="bg-white rounded-lg shadow-sm p-6">
                <h2 class="text-lg font-semibold text-gray-900 mb-4">Review Checkpoints</h2>
                <div id="review-points" class="grid grid-cols-2 md:grid-cols-4 gap-4">
                    <!-- Reviews will be populated here -->
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000';
        
        // Fetch and update dashboard
        async function updateDashboard() {
            try {
                const response = await fetch(`${API_BASE}/dashboard`);
                const data = await response.json();
                
                // Update metrics
                document.getElementById('mrr').textContent = `$${data.metrics.mrr.toFixed(2)}`;
                document.getElementById('arr').textContent = `$${data.metrics.arr.toFixed(2)}`;
                document.getElementById('churn').textContent = `${data.metrics.churn_rate.toFixed(1)}%`;
                document.getElementById('runway').textContent = `${Math.floor(data.metrics.cash_runway_days)} days`;
                
                // Update health score
                document.getElementById('health-score-value').textContent = data.health_score.toFixed(0);
                document.getElementById('health-score').textContent = `Health: ${data.health_score.toFixed(0)}`;
                
                // Update status banner
                const statusText = document.getElementById('status-text');
                const statusIcon = document.getElementById('status-icon');
                const banner = document.getElementById('health-banner');
                
                let statusColor = 'text-green-500';
                let statusBg = 'bg-green-100';
                let statusMessage = 'Operating normally';
                
                if (data.health_score < 40) {
                    statusColor = 'text-red-500';
                    statusBg = 'bg-red-100';
                    statusMessage = 'CRITICAL - Action Required';
                } else if (data.health_score < 60) {
                    statusColor = 'text-yellow-500';
                    statusBg = 'bg-yellow-100';
                    statusMessage = 'Warning - Monitor Closely';
                } else if (data.health_score < 80) {
                    statusColor = 'text-yellow-500';
                    statusBg = 'bg-yellow-100';
                    statusMessage = 'Suboptimal - Improving';
                }
                
                statusText.textContent = statusMessage;
                banner.className = `py-4 px-4 ${statusBg}`;
                
                // Update agents
                const agentsGrid = document.getElementById('agents-grid');
                agentsGrid.innerHTML = '';
                
                for (const [name, health] of Object.entries(data.agents)) {
                    const badgeClass = health.status === 'idle' ? 'bg-green-100 text-green-800' :
                                      health.status === 'processing' ? 'bg-blue-100 text-blue-800' :
                                      'bg-gray-100 text-gray-800';
                    
                    const agentHtml = `
                        <div class="flex items-center justify-between p-3 bg-gray-50 rounded">
                            <div>
                                <span class="font-medium text-gray-900">${name.replace('_', ' ').replace(/(^\w|\w\w)/g, l => l.toUpperCase())}</span>
                                <span class="text-xs text-gray-500">(${health.completed_tasks} tasks)</span>
                            </div>
                            <span class="px-2 py-1 text-xs font-semibold rounded ${badgeClass}">${health.status}</span>
                        </div>
                    `;
                    agentsGrid.innerHTML += agentHtml;
                }
                
                // Update failure conditions
                const failureDiv = document.getElementById('failure-conditions');
                if (Object.keys(data.failure_conditions).length > 0) {
                    failureDiv.innerHTML = '<p class="text-red-600 font-medium">⚠️ Failure conditions detected!</p>';
                    for (const [cond, details] of Object.entries(data.failure_conditions)) {
                        failureDiv.innerHTML += `<p class="text-sm text-red-500">• ${cond}: ${details.value} vs ${details.threshold}</p>`;
                    }
                } else {
                    failureDiv.innerHTML = '<p class="text-green-600 font-medium">✓ All conditions normal</p>';
                }
                
                // Update review points
                const reviewsDiv = document.getElementById('review-points');
                for (const [name, status] of Object.entries(data.review_points)) {
                    const statusClass = status === 'due' ? 'bg-red-100 text-red-800' : 'bg-green-100 text-green-800';
                    reviewsDiv.innerHTML += `<span class="px-3 py-1 text-xs font-semibold rounded ${statusClass}">${name}: ${status}</span>`;
                }
                
                document.getElementById('last-update').textContent = new Date().toLocaleTimeString();
                
            } catch (error) {
                console.error('Failed to fetch dashboard:', error);
            }
        }

        // Quick action buttons
        document.getElementById('btn-scan').addEventListener('click', async () => {
            try {
                const response = await fetch(`${API_BASE}/analyze`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        question: "What are the latest market trends in AI tech?",
                        sector: "technology"
                    })
                });
                const data = await response.json();
                alert('Market scan completed! Check the analysis endpoint.');
            } catch (e) {
                alert('Scan failed. Check console for details.');
            }
        });

        document.getElementById('btn-content').addEventListener('click', async () => {
            try {
                const response = await fetch(`${API_BASE}/analyze`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        question: "Generate competitive analysis report for SaaS startups",
                        sector: "technology"
                    })
                });
                const data = await response.json();
                alert('Content generated!');
            } catch (e) {
                alert('Content generation failed. Check console for details.');
            }
        });

        document.getElementById('btn-report').addEventListener('click', async () => {
            try {
                const response = await fetch(`${API_BASE}/report`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        question: "Market trend report",
                        sector: "technology",
                        timeframe: "last_quarter"
                    })
                });
                const data = await response.json();
                alert('Report created with ' + data.key_findings.length + ' findings');
            } catch (e) {
                alert('Report generation failed. Check console for details.');
            }
        });

        // Initial load and periodic updates
        updateDashboard();
        setInterval(updateDashboard, 5000);
    </script>
</body>
</html>
