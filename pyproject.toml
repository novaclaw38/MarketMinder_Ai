[project]
name = "marketminder-ai"
version = "1.0.0"
description = "Fully automated AI-powered competitive intelligence platform"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["agents*", "core*", "api*", "scripts*"]

[tool.uv.sources]
fastapi = { git = "https://github.com/encode/fastapi.git" }
uvicorn = { git = "https://github.com/encode/uvicorn.git" }
pydantic = { git = "https://github.com/pydantic/pydantic.git" }

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0",
    "black>=23.0.0",
    "ruff>=0.0.260"
]

[tool.ruff]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]