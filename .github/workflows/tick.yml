# Vercel Hobby only allows daily crons, so GitHub Actions drives the frequent ticks.
# Needs repository secrets: APP_URL (e.g. https://your-app.vercel.app) and CRON_SECRET (same value as in Vercel).
name: tick

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call cron endpoints
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL and CRON_SECRET secrets are not set; skipping."
            exit 0
          fi
          for path in venture orchestrate; do
            echo "== $path"
            curl -sS --fail-with-body --max-time 90 -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/$path"
            echo
          done
